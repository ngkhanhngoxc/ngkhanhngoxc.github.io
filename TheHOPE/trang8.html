<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The HOPE - End</title>
    <!-- Nhúng Google Fonts: Times New Roman, Montserrat, và Abril Fatface -->
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Montserrat:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(rgba(26, 8, 8, 0.4), rgba(26, 8, 8, 0.4)), url('end.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: 'Times New Roman', Times, serif;
            padding: 20px;
            text-align: center;
        }

        /* Container chứa các dòng chữ */
        #end-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 90vw;
        }

        /* Dòng 1: "Cho chị câu trả lời nhé?" (Đã giảm 2 size) */
        #line-1 {
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
            font-size: 1.1rem; 
            color: #ffeaa7;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            white-space: nowrap;
            overflow: hidden;
            border-right: 2px solid #ffeaa7;
            width: 0;
            animation: typing 1.5s steps(30, end) forwards, blink 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #ffeaa7; }
        }

        /* Dòng 2: "HAPPY BIRTHDAY><" (Nảy ra, đã giảm 2 size) */
        #line-2 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 1.7rem; 
            color: #ffe699;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #line-2.show {
            opacity: 1;
            transform: scale(1);
        }

        /* Dòng 3: "I love(d) you><" (Rõ dần, đã giảm 2 size) */
        #line-3 {
            font-family: 'Abril Fatface', serif;
            font-size: 1.35rem;
            color: #ffcccc;
            text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.9);
            opacity: 0;
            transform: translateY(10px);
            transition: all 1.2s ease;
        }

        #line-3.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Style riêng cho chữ (d) in nghiêng */
        .italic-d {
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="end-container">
        <!-- Dòng 1: Đánh máy -->
        <div id="line-1">Cho chị câu trả lời nhé?</div>

        <!-- Dòng 2: Nảy ra -->
        <div id="line-2">HAPPY BIRTHDAY&gt;&lt;</div>

        <!-- Dòng 3: Rõ dần (có chữ d in nghiêng) -->
        <div id="line-3">I love<span class="italic-d">(d)</span> you&gt;&lt;</div>
    </div>

    <script>
        const line1 = document.getElementById('line-1');
        const line2 = document.getElementById('line-2');
        const line3 = document.getElementById('line-3');

        // Sau khi dòng 1 chạy xong đánh máy (1.5s), bật hiệu ứng nảy dòng 2
        setTimeout(() => {
            line1.style.borderRight = 'none'; 
            line2.classList.add('show');
        }, 1600);

        // Tiếp tục sau đó một chút, bật hiệu ứng hiện rõ dòng 3
        setTimeout(() => {
            line3.classList.add('show');
        }, 2300);
    </script>
</body>
</html>
